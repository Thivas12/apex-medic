name: Bug report
description: Report a reproducible problem with the app or local setup.
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data. Remove API keys, database URLs, cookies and real case
        details from anything you attach. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, Python version, browser and storage backend.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest synthetic example that shows the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error message if useful.
    validations:
      required: true
